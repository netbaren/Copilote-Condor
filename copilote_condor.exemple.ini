; copilote_condor.exemple.ini - MODÈLE de réglages du Copilote Condor
; Copiez ce fichier sous le nom copilote_condor.ini (dans le même dossier),
; puis adaptez au moins les chemins de la section [Dossiers] et de [Planeur].
;
; =============================================================================
; copilote_condor.ini - Réglages de copilote_condor.py
; =============================================================================
; - Ce fichier doit rester dans le même dossier que copilote_condor.py.
; - Les lignes qui commencent par ; sont des commentaires.
; - Après une modification : enregistrer, puis relancer copilote_condor.py.
; - Une ligne supprimée ou mise en commentaire reprend sa valeur par défaut.
; - Oui/non : écrire oui ou non (ou 1 / 0).
; - Couleurs : un nom anglais (black, white, red, green, yellowgreen, chartreuse,
;   limegreen, orange...) ou un code #RRVVBB (ex. #00a000 = vert franc).

[Connexion]
; Port COM lu par le script : l'autre bout de la paire VSPE (Condor écrit sur COM10)
port_com = COM11
; Débit du port série (celui de Condor ; sans importance avec VSPE)
baud = 4800
; Port UDP : doit être le même que Port= dans le fichier UDP.ini de Condor
port_udp = 55278

[Dossiers]
; Dossier des paysages de Condor (contient AA3\AA3.trn, etc.)
chemin_paysages = C:\Condor3\Landscapes
; Paysage utilisé tant qu'aucun plan de vol n'est chargé
paysage_defaut = AA3
; Plan de vol COURANT : Condor le réécrit à chaque vol, en solo comme en réseau
; (tâche téléchargée depuis le serveur). Le script le surveille et affiche la tâche
; tout seul, sans rien avoir à ouvrir. Laisser vide pour désactiver.
fpl_courant = C:\Users\VOTRE_NOM\Documents\Condor3\Pilots\VOTRE_PILOTE\Flightplan.fpl
; Vérification toutes les ... secondes
surveillance_fpl_s = 5
; Dossier proposé par le bouton « Ouvrir .fpl... » (vos tâches personnelles)
dossier_fpl = C:\Users\VOTRE_NOM\Documents\Condor3\FlightPlans

[Horizon]
; Diamètre de l'horizon, de 170 à 330 pixels
taille_horizon = 260
; Mettre -1 si l'horizon penche du mauvais côté en virage
sens_inclinaison = 1
; Mettre -1 si l'horizon monte quand on cabre
sens_tangage = 1

[Vent]
; Diamètre du cadran de vent par rapport à l'horizon (1.0 = même taille)
rapport_vent = 0.8
; Vent (km/h) qui donne une flèche de longueur maximale
vent_max_kmh = 50
; Lissage du vent : 0.05 = moyenne sur ~20 s ; plus grand = plus réactif mais plus nerveux
lissage_vent = 0.05
; oui : Condor envoie la vitesse indiquée, corrigée en vitesse vraie selon l'altitude
; (vérifié en vol : le vent calculé correspond alors à celui du plan de vol)
vitesse_air_est_ias = oui

[Fenetre]
; Position du coin haut gauche (pixels depuis le coin haut gauche de l'écran)
; et dimensions de la fenêtre au démarrage. Condor est placé à droite, à partir de
; x = 1200 (CondorWindowAdjust.ps1) : le copilote occupe la bande 0 - 1200.
fenetre_x = 0
fenetre_y = 0
fenetre_largeur = 1184
fenetre_hauteur = 1000
; oui : la fenêtre s'ouvre agrandie (plein écran) et ignore les valeurs ci-dessus
fenetre_agrandie = non
; oui : la fenêtre reprend la position et la taille qu'elle avait à sa dernière fermeture
; (mémorisées dans derniere_fenetre.txt ; supprimer ce fichier pour revenir aux valeurs
; ci-dessus)
memoriser_fenetre = non

[Carte]
; Recentrage automatique : la carte se recentre sur le planeur quand il s'approche du bord
recentrage_auto = oui
; Largeur de la bande du bord qui déclenche le recentrage (0.25 = 25 % ; 0.5 = en permanence)
zone_recentrage = 0.25
; Après un clic, un glissé ou un coup de molette sur la carte : pas de recentrage pendant ... s
pause_recentrage_s = 20
; Fond au démarrage : OpenTopoMap (relief)  ou  OpenStreetMap  ou  Satellite (Esri)
;                     ou  Relief Condor (peint d'après le relief du paysage, sans internet)
fond_depart = OpenTopoMap (relief)
; Relief Condor : force de l'ombrage du relief (0 = couleurs seules ; 0.45 conseillé)
ombrage_relief = 0.45
; Relief Condor : dégradé de couleurs
;   rene   = le vôtre (ColorGradient.java) : verts soutenus, Sienne, blanc
;   alpine = teintes de carte suisse : plaines et vallées vertes, jaunes, beiges, bruns, roche
;   alpine_pale = première version d'alpine, plaines plus pâles
;   sepia  = tons chauds et peu éblouissants, sommets ivoire
; palette_relief = rene
palette_relief = alpine
; Relief Condor : forêts lues dans le dossier ForestMaps du paysage (à partir du zoom 10)
forets_relief = oui
; Trace du planeur
couleur_trace = #1f5fd0
epaisseur_trace = 2
; Segments de la tâche
couleur_tache = #d00000
epaisseur_tache = 2
; Points de virage : couleur et hauteur des épingles (pixels)
couleur_tp = purple
hauteur_tp = 30
; Couleur des points de virage sur OpenTopoMap (relief à dominante rouge) : bleu
couleur_tp_opentopomap = #0058c8
; Icône du planeur (fichier image, nez vers le haut, dans le dossier du script)
icone_planeur = planeur_rouge.png
largeur_icone = 56

[Portee]
; --- Zone atteignable en plané ("phares") ---
; Couleur et épaisseur du contour. Essais possibles :
;   yellowgreen (vert-jaune), chartreuse (vert-jaune vif), limegreen (vert clair),
;   #00a000 (vert franc), #006400 (vert foncé), black (noir)
couleur_portee = yellowgreen
epaisseur_portee = 2
; Liseré foncé sous le contour, pour le voir sur les zones vertes de la carte (vide = aucun)
couleur_bord_portee = black
; Largeur du liseré de chaque côté du contour (pixels)
largeur_bord_portee = 1
; Largeur de l'éventail (degrés)
ouverture_phare = 90
; Axe de l'éventail : route (trajectoire au sol) ou cap (direction du nez)
axe_phare = route
; Calcul : vallees (détours permis par vallées et cols) ou droit (lignes droites, plus prudent)
mode_phare = vallees
; Hauteur minimale à garder au-dessus du relief tout au long du trajet (m)
marge_hauteur = 300
; oui : tenir compte du vent (plus loin vent arrière, moins loin vent de face)
portee_avec_vent = oui
; Distance maximale recherchée (km) ; plus grand = calcul plus long en plaine
distance_max_km = 60
; Recalcul de l'éventail toutes les ... secondes
periode_portee_s = 4

[Finesse]
; La finesse est MESURÉE en vol (vitesse air / taux de chute), aucune donnée du planeur.
; Durée de la moyenne (s) : plus long = plus stable, plus court = plus réactif
fenetre_finesse_s = 4
; Bornes de sécurité de la mesure
finesse_min = 5
finesse_max = 60
; Au-delà de cette inclinaison (degrés : virage, spirale), on ne mesure pas
inclinaison_max_mesure = 15

[Panneau]
; Couleurs du panneau "tableau noir"
couleur_panneau = #1c1c1c
couleur_texte = white
couleur_erreur = #ff6b6b
couleur_bouton = #333333
; Hauteur au-dessus du sol affichée dans cette couleur quand elle passe sous marge_hauteur
couleur_alerte_sol = orange
; Heure de Condor (en haut du panneau) et cadre de la finesse
couleur_heure = #d01010
couleur_cadre_finesse = #d01010
; Jauge de ballast (soulignement sous "Eau", proportionnel au remplissage)
couleur_eau = #2f8fff

[Planeur]
; Le planeur est reconnu tout seul d'après le plan de vol.
; VNE : lue dans la fiche que Condor fournit pour chaque planeur
; (Planes\<nom>\<nom>.txt, ligne "Max speed"). Tous les planeurs de Condor en ont une.
chemin_planes = C:\Condor3\Planes
; Volets conseillés : fichier repris de CoTASA, dans le dossier du script
; (sert aussi de VNE de secours si la fiche Condor manque)
fichier_planeurs = CoTASA_data.txt
; Alerte orange à partir de cette fraction de la VNE (vitesse vraie), rouge au-delà
seuil_vne = 0.9
couleur_vne_proche = orange
couleur_vne_depassee = red
; VNE inconnue (aucune fiche) : valeur proposée, affichée en bleu avec un "?" ;
; un clic sur la case VNE permet alors de la corriger (retenue par planeur
; dans vne_perso.txt). Une VNE connue ne se modifie pas.
vne_defaut = 250

[Raccourcis]
; Raccourcis clavier GLOBAUX : ils marchent même quand Condor a la main, sans
; Ctrl+Échap ni Alt+Tab. Il faut une fois :  pip install keyboard
; Condor n'utilise pas la touche Alt ; la combinaison est interceptée et n'arrive pas
; jusqu'à Condor (Alt+C ne recentre donc pas le trim de Condor).
; Écriture : alt+c, alt+shift+c, ctrl+alt+c... ; "plus" pour la touche +
; Pour + et -, les touches du pavé numérique conviennent (Alt + pavé +, Alt + pavé -).
raccourcis_globaux = oui
touche_zoom_plus = alt+w
touche_zoom_moins = alt+d
touche_recentrer = alt+c
touche_fond_suivant = alt+s
